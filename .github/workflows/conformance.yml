name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run CI-only conformance
        run: ./scripts/ci-conformance.sh
      - name: Upload decision dossier and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominance-lattice-evidence-${{ github.sha }}
          path: /tmp/gooo-improvement-dominance-lattice.*/evidence
          if-no-files-found: error
          retention-days: 90
